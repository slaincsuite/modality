spring.datasource.dynamic.primary=master
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:tenantmod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,cn.slainc.redis.autoconfigure.RedisAutoConfiguration,cn.slainc.redis.autoconfigure.RedisStructureAutoConfiguration
modality.redis.cache.enabled=false
modality.redis.config.enabled=false
modality.redis.key.enabled=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.pubsub.enabled=false
modality.redis.rate-limit.enabled=false
modality.redis.satoken.enabled=false
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/tenant-test/**
modality.tenant.status-check.missing-tenant-policy=ALLOW
