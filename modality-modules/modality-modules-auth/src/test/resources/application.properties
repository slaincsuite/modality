spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:authmod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=15
spring.data.redis.password=omni-redis-pass
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/logout,/oauth2/jwks,/auth/qrcode/**,/auth/third/**,/auth/token/**,/oauth2/token,/oauth2/userinfo,/sso/**
modality.thirdauth.platform.wechat.enabled=true
modality.thirdauth.platform.wechat.app-key=wx-key
modality.thirdauth.platform.wechat.app-secret=wx-secret
modality.thirdauth.platform.wechat.callback-base=https://cb.example.com
modality.oauth2.scopes[0].name=openid
modality.oauth2.scopes[0].description=OIDC \u57fa\u7840\u8eab\u4efd\u6807\u8bc6
modality.oauth2.scopes[0].risk-level=LOW
modality.oauth2.scopes[1].name=userinfo
modality.oauth2.scopes[1].description=\u8bfb\u53d6\u7528\u6237\u57fa\u7840\u8d44\u6599
modality.oauth2.scopes[1].risk-level=LOW
modality.oauth2.scopes[2].name=pay
modality.oauth2.scopes[2].description=\u53d1\u8d77\u652f\u4ed8\u4e0e\u8d44\u91d1\u64cd\u4f5c
modality.oauth2.scopes[2].risk-level=HIGH
