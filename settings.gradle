pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { mavenCentral() }
            filter {
                includeGroup 'io.minio'
                includeGroup 'com.googlecode.owasp-java-html-sanitizer'
                includeGroup 'com.github.ben-manes.caffeine'
                includeGroupByRegex 'com\\.fasterxml\\.jackson.*'
            }
        }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
    }
}

rootProject.name = 'modality'

include 'modality-boot'

include 'modality-library:modality-library-spring-boot-bom'
