spring.datasource.dynamic.primary=master
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:modality;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${MODALITY_REDIS_PASSWORD:}
management.endpoints.web.exposure.include=health,info,metrics,prometheus,modality
modality.tenant.status-check.missing-tenant-policy=ALLOW
modality.auth.captcha.enabled=false
modality.infra.notify.allow-internal-webhook=true
modality.security.cookie.secure=false
modality.security.filter.exclude-patterns=/actuator/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/refresh,/auth/logout,/auth/qrcode/**,/auth/third/**,/auth/token/refresh,/oauth2/jwks,/oauth2/token,/oauth2/userinfo,/sso/**
modality.web.open-api.enabled=true
