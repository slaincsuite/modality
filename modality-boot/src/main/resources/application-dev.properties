spring.datasource.dynamic.primary=master
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:modality;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=${MODALITY_REDIS_PASSWORD:}
management.endpoints.web.exposure.include=health,info,metrics,prometheus,modality
modality.tenant.status-check.missing-tenant-policy=ALLOW
modality.auth.captcha.enabled=false
modality.infra.notify.allow-internal-webhook=true
modality.security.cookie.secure=false
modality.security.filter.exclude-patterns=/actuator/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/refresh,/auth/logout,/auth/qrcode/**,/auth/third/**,/auth/token/refresh,/oauth2/jwks,/oauth2/token,/oauth2/userinfo,/sso/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**
modality.web.open-api.enabled=true
springdoc.group-configs[0].group=\u7528\u6237\u6743\u9650\u4e2d\u5fc3
springdoc.group-configs[0].packages-to-scan=cn.slainc.modules.upms
springdoc.group-configs[1].group=\u8ba4\u8bc1\u4e2d\u5fc3
springdoc.group-configs[1].packages-to-scan=cn.slainc.modules.auth
springdoc.group-configs[2].group=\u5ba1\u8ba1\u4e2d\u5fc3
springdoc.group-configs[2].packages-to-scan=cn.slainc.modules.audit
springdoc.group-configs[3].group=\u7b56\u7565\u7ba1\u7406\u4e2d\u5fc3
springdoc.group-configs[3].packages-to-scan=cn.slainc.modules.policy
springdoc.group-configs[4].group=\u5f00\u653e\u5e73\u53f0
springdoc.group-configs[4].packages-to-scan=cn.slainc.modules.open
springdoc.group-configs[5].group=\u57fa\u7840\u8bbe\u65bd\u4e2d\u5fc3
springdoc.group-configs[5].packages-to-scan=cn.slainc.modules.infra
springdoc.swagger-ui.tags-sorter=alpha
