spring.application.name=modality
spring.jackson.time-zone=${MODALITY_TIME_ZONE:Asia/Shanghai}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
modality.jwt.default-algorithm=RS256
modality.mybatis.data-scope.enabled=true
modality.auth.captcha.enabled=true
modality.tenant.enabled=true
modality.tenant.resolver.header.enabled=false
modality.tenant.resolver.session.enabled=true
modality.tenant.status-check.enabled=true
modality.tenant.status-check.missing-tenant-policy=REJECT
modality.security.cookie.secure=true
modality.security.session.active-timeout=1800
modality.security.filter.exclude-patterns=/actuator/health,/actuator/health/**,/actuator/info,/favicon.ico,/error,/captcha/**,/auth/login,/auth/mfa/verify,/auth/refresh,/auth/logout,/auth/qrcode/**,/auth/third/**,/auth/token/refresh,/oauth2/jwks,/oauth2/token,/oauth2/userinfo,/sso/**
modality.web.security-headers.content-security-policy=default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'
modality.web.cors.allowed-origin-patterns=${MODALITY_CORS_ALLOWED_ORIGINS:}
modality.web.cors.allow-credentials=false
modality.web.exception.expose-message=false
modality.web.open-api.enabled=false
modality.web.request-limit.enabled=true
