plugins {
    id 'modality.spring-library-conventions'
}

description = 'Redis 能力'

dependencies {
    api project(':modality-library:modality-library-spring-boot-core')
    api libs.spring.boot.starter.data.redis
    api libs.spring.boot.starter.cache
    api libs.spring.boot.starter.aspectj
    api libs.redisson
    implementation project(':modality-library:modality-library-spring-boot-crypto')
    implementation libs.caffeine
    implementation libs.jackson.databind
    compileOnly libs.sa.token.core
    compileOnly libs.spring.boot.starter.jdbc
    compileOnly libs.micrometer.core
    compileOnly libs.jakarta.validation.api
    testRuntimeOnly libs.sa.token.core
    testRuntimeOnly libs.spring.boot.starter.jdbc
    testRuntimeOnly libs.micrometer.core
    testRuntimeOnly libs.h2
}
