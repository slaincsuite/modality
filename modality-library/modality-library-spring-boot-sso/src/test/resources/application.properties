spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=${MODALITY_REDIS_PASSWORD:}
spring.data.redis.database=9
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ssotest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
sa-token.is-print=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.config.jdbc-repository-enabled=false
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/logout,/oauth2/jwks,/oauth2/**,/sso/**,/test/**
modality.sso.server.secret-key=center-secret-001
modality.sso.client.enabled=true
modality.sso.client.client=web-client
modality.sso.client.secret-key=client-secret-001
modality.sso.client.login-type=APP
