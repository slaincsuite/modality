plugins {
    id 'modality.spring-library-conventions'
}

description = '对象存储'

dependencies {
    api project(':modality-library:modality-library-spring-boot-core')
    api project(':modality-library:modality-library-spring-boot-web')
    api project(':modality-library:modality-library-spring-boot-crypto')
    api libs.minio
    compileOnly libs.aws.sdk.s3
    compileOnly libs.micrometer.core
    testImplementation libs.aws.sdk.s3
    testImplementation libs.micrometer.core
    testImplementation libs.s3mock
    testImplementation libs.s3mock.junit5
}
