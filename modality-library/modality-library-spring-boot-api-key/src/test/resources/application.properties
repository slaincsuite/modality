spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=${MODALITY_REDIS_PASSWORD:}
spring.data.redis.database=10
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:apikeytest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
sa-token.is-print=false
modality.datasource.health.enabled=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.config.jdbc-repository-enabled=false
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/logout,/oauth2/jwks,/test/**
