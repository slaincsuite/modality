spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=false
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:modality-ds;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.datasource.dynamic.datasource.slave_1.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.slave_1.url=jdbc:h2:mem:modality-ds-slave1;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.slave_1.username=sa
spring.datasource.dynamic.datasource.slave_1.password=
spring.datasource.dynamic.datasource.slave_2.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.slave_2.url=jdbc:h2:mem:modality-ds-slave2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.slave_2.username=sa
spring.datasource.dynamic.datasource.slave_2.password=
modality.datasource.pool.max-wait-millis=2000
modality.datasource.health.enabled=false
modality.datasource.encrypt.enabled=true
modality.datasource.encrypt.key=modality-test-kek
modality.datasource.encrypt.key-id=test
