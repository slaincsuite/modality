plugins {
    id 'modality.spring-library-conventions'
}

description = '内置搜索引擎'

dependencies {
    api project(':modality-library:modality-library-spring-boot-core')
    api project(':modality-library:modality-library-spring-boot-mybatis')

    implementation libs.lucene.core
    implementation libs.lucene.analysis.common
    implementation libs.lucene.queryparser
    implementation libs.lucene.highlighter
}
