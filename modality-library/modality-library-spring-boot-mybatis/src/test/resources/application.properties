spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.driver-class-name=org.h2.Driver
spring.datasource.dynamic.datasource.master.url=jdbc:h2:mem:modality-mybatis;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.username=sa
spring.datasource.dynamic.datasource.master.password=
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
modality.mybatis.tenant.enabled=true
modality.mybatis.tenant.column=tenant_id
modality.mybatis.tenant.super-admin-ignores=true
modality.mybatis.tenant.ignore-tables=t_dict
modality.mybatis.sql-log.enabled=true
modality.mybatis.sql-log.slow-threshold=0
modality.mybatis.sql-log.async=false
modality.mybatis.sql-log.print-parameters=true
modality.mybatis.sql-log.audit=true
modality.mybatis.fill.enabled=true
modality.mybatis.encrypt.enabled=true
modality.mybatis.encrypt.secret-key=modality-mybatis-test-key
modality.mybatis.data-scope.enabled=true
modality.datasource.health.enabled=false
