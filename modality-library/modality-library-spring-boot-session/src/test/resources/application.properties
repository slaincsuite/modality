spring.application.name=session-test
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=${MODALITY_REDIS_PASSWORD:}
spring.data.redis.database=3
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s
spring.data.redis.lettuce.shutdown-timeout=100ms
sa-token.is-print=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.config.jdbc-repository-enabled=false
modality.web.websocket.enabled=false
logging.level.cn.slainc=INFO
