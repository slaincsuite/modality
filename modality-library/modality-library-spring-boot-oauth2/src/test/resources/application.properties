spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=omni-redis-pass
spring.data.redis.database=8
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:oauth2test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
sa-token.is-print=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.config.jdbc-repository-enabled=false
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/logout,/oauth2/jwks,/oauth2/**,/test/**
modality.oauth2.scopes[0].name=openid
modality.oauth2.scopes[0].description=OIDC 基础身份标识
modality.oauth2.scopes[0].risk-level=LOW
modality.oauth2.scopes[1].name=userinfo
modality.oauth2.scopes[1].description=读取用户基础资料
modality.oauth2.scopes[1].risk-level=LOW
modality.oauth2.scopes[2].name=pay
modality.oauth2.scopes[2].description=发起支付与资金操作
modality.oauth2.scopes[2].risk-level=HIGH
