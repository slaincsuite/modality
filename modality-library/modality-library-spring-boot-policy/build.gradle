plugins {
    id 'modality.spring-library-conventions'
}

description = '策略引擎'

dependencies {
    api project(':modality-library:modality-library-spring-boot-core')
    api libs.spring.boot.starter.aspectj
    implementation libs.ipaddress
    compileOnly project(':modality-library:modality-library-spring-boot-security')
    compileOnly libs.spring.boot.starter.jdbc
    testImplementation project(':modality-library:modality-library-spring-boot-web')
    testImplementation project(':modality-library:modality-library-spring-boot-security')
    testImplementation project(':modality-library:modality-library-spring-boot-redis')
    testImplementation libs.spring.boot.starter.jdbc
    testRuntimeOnly libs.h2
}
