spring.application.name=policy-test
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=omni-redis-pass
spring.data.redis.database=12
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s
sa-token.is-print=false
modality.redis.lock.enabled=false
modality.redis.monitor.enabled=false
modality.redis.config.jdbc-repository-enabled=false
modality.security.filter.exclude-patterns=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/webjars/**,/favicon.ico,/error,/captcha/**,/auth/login,/auth/logout,/oauth2/jwks,/policy-test/**
