plugins {
    id 'modality.spring-library-conventions'
}

description = '安全'

dependencies {
    api project(':modality-library:modality-library-spring-boot-core')
    api project(':modality-library:modality-library-spring-boot-web')
    api project(':modality-library:modality-library-spring-boot-redis')
    api libs.sa.token.spring.boot4.starter
    implementation project(':modality-library:modality-library-spring-boot-crypto')
    compileOnly project(':modality-library:modality-library-spring-boot-monitor')
    testImplementation project(':modality-library:modality-library-spring-boot-monitor')
    testImplementation libs.micrometer.core
}
